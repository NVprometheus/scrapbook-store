<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel - Nikiara.studio</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px; margin: 8px 0 15px; border: 1px solid #ddd; border-radius: 6px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-success { background: #e7efd9; color: #4d5b4f; }
    .badge-danger { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>Nikiara Admin</h2>
      <form id="loginForm">
        <input type="password" id="adminPassword" required placeholder="Password Admin" style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ccc; border-radius:8px;">
        <button type="submit" class="primary-button" style="width:100%">Login</button>
        <p id="loginError" style="display:none; color:red; margin-top:10px;">Password salah!</p>
      </form>
    </div>
  </div>

  <div id="adminDashboard" class="admin-layout" style="display: none;">
    <aside class="sidebar">
      <div class="sidebar-header"><h2>Admin Panel</h2></div>
      <nav class="sidebar-nav" id="sidebarNav">
        <button class="nav-item active" data-target="panel-dashboard">📊 Dashboard</button>
        <button class="nav-item" data-target="panel-products">📦 Products</button>
        <button class="nav-item" data-target="panel-orders">🛒 Orders</button>
        <button id="logoutBtn" class="nav-item text-danger" style="margin-top:auto">🚪 Logout</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-header"><h2 id="currentPanelTitle">Dashboard</h2></header>
      <div class="content-area">
        <div id="panel-dashboard" class="panel active">
          <div class="stats-grid">
            <div class="stat-card"><h3>Total Orders</h3><p class="stat-value">0</p></div>
            <div class="stat-card"><h3>Active Products</h3><p class="stat-value">0</p></div>
            <div class="stat-card"><h3>Total Revenue</h3><p class="stat-value">Rp0</p></div>
          </div>
        </div>

        <div id="panel-products" class="panel" style="display: none;">
          <div style="margin-bottom: 15px; text-align: right;">
            <button class="primary-button" onclick="AdminApp.openProductModal()">+ Tambah Produk</button>
          </div>
          <div class="placeholder-box"><p>⏳ Memuat Produk...</p></div>
        </div>

        <div id="panel-orders" class="panel" style="display: none;">
          <div class="placeholder-box"><p>⏳ Memuat Pesanan...</p></div>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL PRODUK -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom: 15px; color: #55423d;">Tambah Produk</h3>
      <form id="productForm">
        <input type="hidden" id="formProductId">
        
        <label>Foto Produk</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <input type="file" id="formImageFile" accept="image/*" style="flex:1;">
          <input type="hidden" id="formImageUrl">
          <div id="imagePreview" style="width:45px; height:45px; border-radius:6px; background:#eee; display:none; background-size:cover;"></div>
        </div>
        <p id="uploadStatus" style="font-size:12px; margin-top:-10px; margin-bottom:15px; display:none;"></p>

        <label>Nama Produk</label>
        <input type="text" id="formName" required>
        
        <div style="display:flex; gap:10px;">
          <div style="flex:1"><label>Harga (Rp)</label><input type="number" id="formPrice" required></div>
          <div style="flex:1"><label>Stok</label><input type="number" id="formStock" required></div>
        </div>
        
        <label>Kategori</label>
        <select id="formCategory" required>
          <option value="Paper">Paper</option>
          <option value="Sticker">Sticker</option>
          <option value="Journal">Journal</option>
          <option value="Decoration">Decoration</option>
        </select>

        <label>Deskripsi Singkat</label>
        <textarea id="formDescription" rows="2"></textarea>

        <label>Status</label>
        <select id="formActive">
          <option value="TRUE">Aktif</option>
          <option value="FALSE">Nonaktif</option>
        </select>
        
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="button" onclick="AdminApp.closeProductModal()" style="flex:1; padding:10px; background:#eee; border-radius:8px;">Batal</button>
          <button type="submit" class="primary-button" style="flex:1;" id="saveProductBtn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
